<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">LexAI — osobisty asystent prawny</title>
  <desc id="description">Analizuj pisma, porządkuj dokumenty i przygotowuj kolejne kroki.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b11"/>
      <stop offset="0.58" stop-color="#111522"/>
      <stop offset="1" stop-color="#201b12"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="58%">
      <stop offset="0" stop-color="#64748b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <path d="M0 95h1200M0 535h1200" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(92 98)">
    <rect width="64" height="64" rx="18" fill="#64748b" fill-opacity="0.12" stroke="#94a3b8" stroke-opacity="0.75"/>
    <rect x="21" y="35" width="6" height="16" rx="3" fill="url(#slate)"/>
    <rect x="30" y="25" width="6" height="26" rx="3" fill="url(#slate)"/>
    <rect x="39" y="31" width="6" height="20" rx="3" fill="url(#slate)"/>
  </g>
  <text x="182" y="142" fill="#f6f1e7" font-family="Arial, sans-serif" font-size="36" font-weight="700">LexAI</text>
  <text x="92" y="300" fill="#f6f1e7" font-family="Arial, sans-serif" font-size="78" font-weight="700">Twój osobisty</text>
  <text x="92" y="390" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="78" font-weight="700">asystent prawny AI.</text>
  <text x="96" y="472" fill="#a6a9b4" font-family="Arial, sans-serif" font-size="27">Analizuj pisma. Porządkuj sprawy. Działaj pewniej.</text>
  <text x="1102" y="566" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="3">LEXAI · LEGAL INTELLIGENCE</text>
</svg>
